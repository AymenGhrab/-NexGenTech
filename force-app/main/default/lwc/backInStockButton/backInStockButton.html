<template>
    <!-- Show main button or input only when out of stock -->
    <template if:true={showButton}>
        <div class="container slds-p-around_medium">
            <div class="slds-text-heading_small slds-m-bottom_small">
                Notify Me When Available
            </div>

            <!-- Authenticated user: just show a single button -->
            <template if:true={isAuthenticated}>
                <lightning-button
                    variant="brand"
                    label="Get Notified"
                    title="Get notified when back in stock"
                    onclick={handleAuthenticatedSubmit}
                    disabled={isSubmitting}>
                </lightning-button>
            </template>

            <!-- Guest user: show email input and submit -->
            <template if:false={isAuthenticated}>
                <lightning-input
                    type="email"
                    label="Email Address"
                    value={email}
                    required
                    message-when-value-missing="Please enter your email"
                    onchange={handleEmailChange}>
                </lightning-input>

                <div class="slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label="Submit Request"
                        title="Submit email to get notified"
                        onclick={handleGuestSubmit}
                        disabled={isSubmitting}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </template>

    <!-- Success Toast UI -->
    <template if:true={showSuccess}>
        <div class="slds-notify slds-notify_toast slds-theme_success">
            <div class="slds-notify__content">
                <h2 class="slds-text-heading_small">Success!</h2>
                <p>You'll be notified when this product is back in stock.</p>
            </div>
        </div>
    </template>
</template>
