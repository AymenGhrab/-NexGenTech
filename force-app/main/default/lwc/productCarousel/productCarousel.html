<template>
    <div class="carousel-container">
      <div class="carousel-track">
        <template for:each={slides} for:item="slide">
          <div class="slide" key={slide.id}>
            <img src={slide.imageUrl} alt={slide.alt} />
            <div class="indicators-overlay">
              <template for:each={slides} for:item="dotSlide">
                <span
                  key={dotSlide.id}
                  class={dotSlide.dotClass}
                  data-index={dotSlide.index}
                  onclick={goToSlide}>
                  &#9679;
                </span>
              </template>
            </div>
          </div>
        </template>
      </div>
  
      <button class="nav-button left" onclick={scrollLeft}>&#8592;</button>
      <button class="nav-button right" onclick={scrollRight}>&#8594;</button>
    </div>
  </template>
