<template>
    <footer class="footer">
        <div class="footer-container">
            <!-- Logo Section -->
            <div class="footer-section logo-section">
                <img src="https://i.imgur.com/5ulv93F.png" alt="Nexera Logo" class="site-logo" />
            </div>

            <!-- Newsletter Section -->
            <div class="footer-section">
                <h3>📩 Newsletter</h3>
                <p>Subscribe to our newsletter for updates.</p>

                <template if:false={showSuccess}>
                    <template if:false={isAuthenticated}>
                        <input
                            type="email"
                            class="newsletter-input"
                            placeholder="Enter your email"
                            value={email}
                            onchange={handleEmailChange}
                            required/>
                    </template>

                    <div class="slds-m-top_small">
                        <button
                            class="subscribe-btn"
                            onclick={handleSubscribe}
                            disabled={isSubmitting}>
                            Subscribe
                        </button>
                    </div>
                </template>

                <template if:true={showSuccess}>
                    <p class="slds-text-color_success">✅ Successfully subscribed!</p>
                </template>
            </div>

            <!-- Contact Section -->
            <div class="footer-section">
                <h3>📞 Contact Us</h3>
                <p>Email: <a href="mailto:support@nexera.com">support@nexera.com</a></p>
                <p>Phone: +216 99 999 999</p>
                <p>Address: 123 Rue des Technologies, Tunis</p>
            </div>
        </div>

        <p class="footer-bottom">&copy; 2025 Nexera | All rights reserved.</p>
    </footer>
</template>
